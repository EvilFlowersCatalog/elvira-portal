name: Deploy

# master -> elvira.stuba.sk       (stu config, `npm run build:stu`)
# dev    -> dev.elvira.stuba.sk   (dev config, `npm run build:dev`)
#        -> e-knihy.ku.sk         (KU production, `npm run build:ku`; job `deploy-ku` below)
#
# Per-environment configuration lives in the GitHub Environments
# "elvira.stuba.sk" (master) and "dev.elvira.stuba.sk" (dev):
#   Variables (Settings > Environments > Variables):
#     DEPLOY_USER   - ssh user (e.g. elvira)
#     DEPLOY_HOST   - gateway hostname reachable from the runner
#     DEPLOY_PATH   - deploy root (e.g. /mnt/data/var/www/dev.elvira.stuba.sk)
#     DEPLOY_PORT   - ssh port (optional, defaults to 22)
#   Secrets (Settings > Environments > Secrets):
#     DEPLOY_PRIVATE_KEY - ssh private key for DEPLOY_USER
#
# On-disk layout (nginx `root` points at `<DEPLOY_PATH>/current`):
#   <DEPLOY_PATH>/
#     current -> releases/<release>      (symlink, atomically swapped)
#     releases/<release>/                (last 5 kept, older pruned)

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Which EvilFlowersViewer every build of this run ships:
  #   master -> the commit pinned in package-lock.json (empty `sha`, nothing overridden)
  #   dev    -> the head of the viewer's `develop` at the time of the run, for dev.elvira.stuba.sk,
  #             e-knihy.ku.sk and the :dev image alike. Resolved once, as a commit, so the three
  #             builds cannot drift apart and the image's layer cache cannot serve an older viewer
  #             (a literal `develop` build-arg never changes the cache key).
  # A new viewer develop commit alone does not start this workflow: re-run it from Actions
  # (workflow_dispatch on `dev`) or push to dev.
  viewer:
    name: Viewer (${{ github.ref_name }})
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the viewer commit
        id: resolve
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Viewer: the commit pinned in package-lock.json" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha="$(git ls-remote https://github.com/EvilFlowersCatalog/EvilFlowersViewer.git refs/heads/develop | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve EvilFlowersViewer develop"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Viewer: EvilFlowersViewer develop @ [\`${sha::7}\`](https://github.com/EvilFlowersCatalog/EvilFlowersViewer/commit/${sha})" >> "$GITHUB_STEP_SUMMARY"

  # One image for every client (#61): ghcr.io/evilflowerscatalog/elvira-portal, configured per
  # deployment by a mounted /config.json. Tags: :dev / :master (floating) and :sha-<short>.
  # CI does not touch the cluster; ops rolls out (knowledge#83). Needs only GITHUB_TOKEN.
  # Built on every push, and on a manual run of dev (to pick up a newer viewer develop).
  image:
    name: Image (${{ github.ref_name }})
    if: github.event_name == 'push' || github.ref_name == 'dev'
    needs: viewer
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/evilflowerscatalog/elvira-portal
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VIEWER_SHA=${{ needs.viewer.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Build & deploy (${{ github.ref_name }})
    needs: viewer
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'elvira.stuba.sk' || 'dev.elvira.stuba.sk' }}
      url: ${{ github.ref_name == 'master' && 'https://elvira.stuba.sk' || 'https://dev.elvira.stuba.sk' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile pins a commit of EvilFlowersViewer (git dependency; its `prepare` builds dist/,
      # EvilFlowersViewer#149). master ships that pin (bump it with
      # `npm install github:EvilFlowersCatalog/EvilFlowersViewer#<sha>`); dev replaces it below.
      - name: Install dependencies
        run: npm ci

      # dev: the viewer develop commit resolved by the `viewer` job (see there).
      - name: Viewer (develop)
        if: needs.viewer.outputs.sha != ''
        env:
          VIEWER_SHA: ${{ needs.viewer.outputs.sha }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "github:EvilFlowersCatalog/EvilFlowersViewer#${VIEWER_SHA}"
          installed="$(jq -r '.packages["node_modules/@evilflowers/evilflowersviewer"].resolved' node_modules/.package-lock.json)"
          echo "Installed viewer: ${installed}"
          case "$installed" in
            *"#${VIEWER_SHA}") ;;
            *) echo "::error::Expected viewer ${VIEWER_SHA}, installed ${installed}"; exit 1 ;;
          esac
          test -f node_modules/@evilflowers/evilflowersviewer/dist/evilFlowersViewer.es.js

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        # ELVIRA_* config comes from the GitHub Environment variables below.
        # Vite gives process.env vars (matching envPrefix) priority over the
        # committed env/.env.<mode> files, so these override them in CI. The
        # files remain the fallback for local dev only. NOTE: an unset variable
        # injects an empty string that still overrides the file, so every value
        # a build needs must be set in the environment (empty UMAMI is fine).
        env:
          ELVIRA_BASE_URL: ${{ vars.ELVIRA_BASE_URL }}
          ELVIRA_CATALOG_ID: ${{ vars.ELVIRA_CATALOG_ID }}
          ELVIRA_THEME: ${{ vars.ELVIRA_THEME }}
          ELVIRA_UMAMI_SERVER: ${{ vars.ELVIRA_UMAMI_SERVER }}
          ELVIRA_UMAMI_WEBSITE: ${{ vars.ELVIRA_UMAMI_WEBSITE }}
          ELVIRA_EXPERIMENTAL_FEATURES: ${{ vars.ELVIRA_EXPERIMENTAL_FEATURES }}
          # Optional per-feature build defaults (`assistant=off,graph=on`); Administration › Features
          # overrides them at runtime once the catalog has portal.features (EvilFlowersCatalog#212).
          ELVIRA_FEATURES: ${{ vars.ELVIRA_FEATURES }}
          # Optional: the collection shown as the themed row on Home (empty hides the row).
          ELVIRA_FEATURED_FEED_ID: ${{ vars.ELVIRA_FEATURED_FEED_ID }}
          # Optional: browser tracing via Grafana Faro (elvira-portal#39). Empty URL = no telemetry.
          # The API key ships in the bundle (the receiver also checks CORS); kept as a secret anyway.
          ELVIRA_FARO_URL: ${{ vars.ELVIRA_FARO_URL }}
          ELVIRA_FARO_API_KEY: ${{ secrets.ELVIRA_FARO_API_KEY }}
          ELVIRA_FARO_ENVIRONMENT: ${{ vars.ELVIRA_FARO_ENVIRONMENT }}
          ELVIRA_FARO_SAMPLE_RATE: ${{ vars.ELVIRA_FARO_SAMPLE_RATE }}
          # Reader PDF streaming (elvira-portal#63): range-loads the signed stream_url. On for dev unless
          # the environment variable says otherwise; empty = the code's default (off). Chunk size and
          # auto-fetch are optional (empty = 262144 bytes, auto-fetch on).
          ELVIRA_VIEWER_STREAMING: ${{ vars.ELVIRA_VIEWER_STREAMING || (github.ref_name == 'dev' && 'true' || '') }}
          ELVIRA_VIEWER_RANGE_CHUNK_SIZE: ${{ vars.ELVIRA_VIEWER_RANGE_CHUNK_SIZE }}
          ELVIRA_VIEWER_AUTO_FETCH: ${{ vars.ELVIRA_VIEWER_AUTO_FETCH }}
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            npm run build:stu
          else
            npm run build:dev
          fi

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy release & swap symlink
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -p ${PORT} ${DEPLOY_USER}@${DEPLOY_HOST}"
          RELEASE="$(date -u +%Y-%m-%d_%H%M%S)-${GITHUB_SHA::7}"
          RELEASE_DIR="${DEPLOY_PATH}/releases/${RELEASE}"

          echo "Deploying release ${RELEASE} to ${DEPLOY_HOST}:${RELEASE_DIR}"

          # Ensure the releases directory exists.
          $SSH "mkdir -p '${DEPLOY_PATH}/releases'"

          # Upload the build into a fresh release dir. --link-dest hardlinks
          # unchanged files against the currently live release to save space.
          rsync -az --delete --human-readable \
            -e "ssh -p ${PORT}" \
            --link-dest="${DEPLOY_PATH}/current/" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          # Atomically flip `current` -> new release, then prune old releases
          # keeping the 5 most recent (the just-deployed one is always newest).
          $SSH "bash -s" <<EOF
          set -euo pipefail
          cd '${DEPLOY_PATH}'
          ln -sfn 'releases/${RELEASE}' current.tmp
          mv -T current.tmp current
          cd releases
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          echo "Active release: \$(readlink '${DEPLOY_PATH}/current')"
          EOF

  # dev -> e-knihy.ku.sk (KU production, `npm run build:ku`, elvira-portal#57).
  # KU production runs the dev packages, so every push to `dev` deploys it too.
  # GitHub Environment "e-knihy.ku.sk" (deployable from `dev` only; host side in knowledge#83):
  #   Variables: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PATH, TS_LOGIN_SERVER
  #   Secrets:   DEPLOY_PRIVATE_KEY, TS_AUTHKEY
  # The host is not reachable from GitHub's runners, so the job joins the private network first
  # with a tagged, ephemeral pre-auth key that reaches the deploy host's SSH only.
  # Rollback: re-run an older successful run of this workflow.
  deploy-ku:
    name: Build & deploy KU (e-knihy.ku.sk)
    if: github.ref_name == 'dev'
    needs: viewer
    runs-on: ubuntu-latest
    environment:
      name: e-knihy.ku.sk
      url: https://e-knihy.ku.sk
    concurrency:
      group: deploy-ku
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # KU production runs the dev packages: the same viewer develop commit as dev.elvira.stuba.sk.
      - name: Viewer (develop)
        env:
          VIEWER_SHA: ${{ needs.viewer.outputs.sha }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "github:EvilFlowersCatalog/EvilFlowersViewer#${VIEWER_SHA}"
          installed="$(jq -r '.packages["node_modules/@evilflowers/evilflowersviewer"].resolved' node_modules/.package-lock.json)"
          echo "Installed viewer: ${installed}"
          case "$installed" in
            *"#${VIEWER_SHA}") ;;
            *) echo "::error::Expected viewer ${VIEWER_SHA}, installed ${installed}"; exit 1 ;;
          esac
          test -f node_modules/@evilflowers/evilflowersviewer/dist/evilFlowersViewer.es.js

      # No ELVIRA_* env here: an unset variable injects an empty string that would override
      # env/.env.ku (see the `deploy` job's Build step). KU's config lives in env/.env.ku.
      - name: Build (KU profile, env/.env.ku)
        run: npm run build:ku

      - name: Bundle is built for KU
        run: grep -rq "api.e-knihy.ku.sk" dist/assets

      - name: Release info
        env:
          VIEWER_SHA: ${{ needs.viewer.outputs.sha }}
        run: |
          echo "{\"release\":\"$(date -u +%Y-%m-%d_%H%M%S)-${GITHUB_SHA::7}\",\"commit\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\",\"viewer\":\"${VIEWER_SHA}\"}" > dist/version.json

      # Private network: ephemeral node, tagged key (reaches the deploy host's SSH only).
      - name: Join the private network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --login-server=${{ vars.TS_LOGIN_SERVER }}
          hostname: gha-elvira-portal-ku-${{ github.run_id }}
          version: 1.104.7   # the control server needs clients >= 1.104.4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Same layout as the `deploy` job; the release name comes from dist/version.json.
      - name: Deploy release & swap symlink
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -p ${PORT} ${DEPLOY_USER}@${DEPLOY_HOST}"
          RELEASE="$(jq -r .release dist/version.json)"
          RELEASE_DIR="${DEPLOY_PATH}/releases/${RELEASE}"

          echo "Deploying release ${RELEASE} to ${DEPLOY_HOST}:${RELEASE_DIR}"

          $SSH "mkdir -p '${DEPLOY_PATH}/releases'"

          rsync -az --delete --human-readable \
            -e "ssh -p ${PORT}" \
            --link-dest="${DEPLOY_PATH}/current/" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          $SSH "bash -s" <<EOF
          set -euo pipefail
          cd '${DEPLOY_PATH}'
          ln -sfn 'releases/${RELEASE}' current.tmp
          mv -T current.tmp current
          cd releases
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          echo "Active release: \$(readlink '${DEPLOY_PATH}/current')"
          EOF
