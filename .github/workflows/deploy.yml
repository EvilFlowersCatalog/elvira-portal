name: Deploy

# master -> elvira.stuba.sk       (stu config, `npm run build:stu`)
# dev    -> dev.elvira.stuba.sk   (dev config, `npm run build:dev`)
#        -> e-knihy.ku.sk         (KU production, `npm run build:ku`; job `deploy-ku` below)
#
# Per-environment configuration lives in the GitHub Environments
# "elvira.stuba.sk" (master) and "dev.elvira.stuba.sk" (dev):
#   Variables (Settings > Environments > Variables):
#     DEPLOY_USER   - ssh user (e.g. elvira)
#     DEPLOY_HOST   - gateway hostname reachable from the runner
#     DEPLOY_PATH   - deploy root (e.g. /mnt/data/var/www/dev.elvira.stuba.sk)
#     DEPLOY_PORT   - ssh port (optional, defaults to 22)
#   Secrets (Settings > Environments > Secrets):
#     DEPLOY_PRIVATE_KEY - ssh private key for DEPLOY_USER
#
# On-disk layout (nginx `root` points at `<DEPLOY_PATH>/current`):
#   <DEPLOY_PATH>/
#     current -> releases/<release>      (symlink, atomically swapped)
#     releases/<release>/                (last 5 kept, older pruned)

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'elvira.stuba.sk' || 'dev.elvira.stuba.sk' }}
      url: ${{ github.ref_name == 'master' && 'https://elvira.stuba.sk' || 'https://dev.elvira.stuba.sk' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dev ships the latest viewer `develop` (installed from git; its `prepare`
      # builds dist/, EvilFlowersViewer#149) instead of the npm version in the
      # lockfile. master stays on npm until the viewer's `main` has `prepare`
      # too; then drop the `if` and install
      # `#${{ github.ref_name == 'master' && 'main' || 'develop' }}`.
      - name: Viewer (latest develop)
        if: github.ref_name != 'master'
        run: npm install --no-save "github:EvilFlowersCatalog/EvilFlowersViewer#develop"

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        # ELVIRA_* config comes from the GitHub Environment variables below.
        # Vite gives process.env vars (matching envPrefix) priority over the
        # committed env/.env.<mode> files, so these override them in CI. The
        # files remain the fallback for local dev only. NOTE: an unset variable
        # injects an empty string that still overrides the file, so every value
        # a build needs must be set in the environment (empty UMAMI is fine).
        env:
          ELVIRA_BASE_URL: ${{ vars.ELVIRA_BASE_URL }}
          ELVIRA_CATALOG_ID: ${{ vars.ELVIRA_CATALOG_ID }}
          ELVIRA_THEME: ${{ vars.ELVIRA_THEME }}
          ELVIRA_UMAMI_SERVER: ${{ vars.ELVIRA_UMAMI_SERVER }}
          ELVIRA_UMAMI_WEBSITE: ${{ vars.ELVIRA_UMAMI_WEBSITE }}
          ELVIRA_EXPERIMENTAL_FEATURES: ${{ vars.ELVIRA_EXPERIMENTAL_FEATURES }}
          # Optional per-feature build defaults (`assistant=off,graph=on`); Administration › Features
          # overrides them at runtime once the catalog has portal.features (EvilFlowersCatalog#212).
          ELVIRA_FEATURES: ${{ vars.ELVIRA_FEATURES }}
          # Optional: the collection shown as the themed row on Home (empty hides the row).
          ELVIRA_FEATURED_FEED_ID: ${{ vars.ELVIRA_FEATURED_FEED_ID }}
          # Optional: browser tracing via Grafana Faro (elvira-portal#39). Empty URL = no telemetry.
          # The API key ships in the bundle (the receiver also checks CORS); kept as a secret anyway.
          ELVIRA_FARO_URL: ${{ vars.ELVIRA_FARO_URL }}
          ELVIRA_FARO_API_KEY: ${{ secrets.ELVIRA_FARO_API_KEY }}
          ELVIRA_FARO_ENVIRONMENT: ${{ vars.ELVIRA_FARO_ENVIRONMENT }}
          ELVIRA_FARO_SAMPLE_RATE: ${{ vars.ELVIRA_FARO_SAMPLE_RATE }}
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            npm run build:stu
          else
            npm run build:dev
          fi

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy release & swap symlink
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -p ${PORT} ${DEPLOY_USER}@${DEPLOY_HOST}"
          RELEASE="$(date -u +%Y-%m-%d_%H%M%S)-${GITHUB_SHA::7}"
          RELEASE_DIR="${DEPLOY_PATH}/releases/${RELEASE}"

          echo "Deploying release ${RELEASE} to ${DEPLOY_HOST}:${RELEASE_DIR}"

          # Ensure the releases directory exists.
          $SSH "mkdir -p '${DEPLOY_PATH}/releases'"

          # Upload the build into a fresh release dir. --link-dest hardlinks
          # unchanged files against the currently live release to save space.
          rsync -az --delete --human-readable \
            -e "ssh -p ${PORT}" \
            --link-dest="${DEPLOY_PATH}/current/" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          # Atomically flip `current` -> new release, then prune old releases
          # keeping the 5 most recent (the just-deployed one is always newest).
          $SSH "bash -s" <<EOF
          set -euo pipefail
          cd '${DEPLOY_PATH}'
          ln -sfn 'releases/${RELEASE}' current.tmp
          mv -T current.tmp current
          cd releases
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          echo "Active release: \$(readlink '${DEPLOY_PATH}/current')"
          EOF

  # dev -> e-knihy.ku.sk (KU production, `npm run build:ku`, elvira-portal#57).
  # KU production runs the dev packages, so every push to `dev` deploys it too.
  # GitHub Environment "e-knihy.ku.sk" (deployable from `dev` only; host side in knowledge#83):
  #   Variables: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PATH, TS_LOGIN_SERVER
  #   Secrets:   DEPLOY_PRIVATE_KEY, TS_AUTHKEY
  # The host is not reachable from GitHub's runners, so the job joins the private network first
  # with a tagged, ephemeral pre-auth key that reaches the deploy host's SSH only.
  # Rollback: re-run an older successful run of this workflow.
  deploy-ku:
    name: Build & deploy KU (e-knihy.ku.sk)
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: e-knihy.ku.sk
      url: https://e-knihy.ku.sk
    concurrency:
      group: deploy-ku
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # KU production runs the dev packages: the viewer's develop, like dev.elvira.stuba.sk.
      - name: Viewer (latest develop)
        run: npm install --no-save "github:EvilFlowersCatalog/EvilFlowersViewer#develop"

      # No ELVIRA_* env here: an unset variable injects an empty string that would override
      # env/.env.ku (see the `deploy` job's Build step). KU's config lives in env/.env.ku.
      - name: Build (KU profile, env/.env.ku)
        run: npm run build:ku

      - name: Bundle is built for KU
        run: grep -rq "api.e-knihy.ku.sk" dist/assets

      - name: Release info
        run: |
          echo "{\"release\":\"$(date -u +%Y-%m-%d_%H%M%S)-${GITHUB_SHA::7}\",\"commit\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\"}" > dist/version.json

      # Private network: ephemeral node, tagged key (reaches the deploy host's SSH only).
      - name: Join the private network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --login-server=${{ vars.TS_LOGIN_SERVER }}
          hostname: gha-elvira-portal-ku-${{ github.run_id }}
          version: 1.104.7   # the control server needs clients >= 1.104.4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Same layout as the `deploy` job; the release name comes from dist/version.json.
      - name: Deploy release & swap symlink
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -p ${PORT} ${DEPLOY_USER}@${DEPLOY_HOST}"
          RELEASE="$(jq -r .release dist/version.json)"
          RELEASE_DIR="${DEPLOY_PATH}/releases/${RELEASE}"

          echo "Deploying release ${RELEASE} to ${DEPLOY_HOST}:${RELEASE_DIR}"

          $SSH "mkdir -p '${DEPLOY_PATH}/releases'"

          rsync -az --delete --human-readable \
            -e "ssh -p ${PORT}" \
            --link-dest="${DEPLOY_PATH}/current/" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          $SSH "bash -s" <<EOF
          set -euo pipefail
          cd '${DEPLOY_PATH}'
          ln -sfn 'releases/${RELEASE}' current.tmp
          mv -T current.tmp current
          cd releases
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          echo "Active release: \$(readlink '${DEPLOY_PATH}/current')"
          EOF
